name: CI

on:
  pull_request:
  push:
    branches:
      - main

# PR runs are disposable, so keep only the newest per branch. Main pushes get
# a group per commit instead: GitHub holds at most one pending run per group
# and a newer run evicts the pending one, so a shared main group would drop
# intermediate merges along with their post-merge tests and immutable
# sha-<sha> image. Every main commit therefore runs, and the moving :latest
# tag is kept monotonic by the tag-resolution step in artifact-registry rather
# than by queueing.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run basedpyright

      - name: Tests
        run: uv run pytest -q

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/nolgiainc/gnosis:latest
            ghcr.io/nolgiainc/gnosis:sha-${{ github.sha }}

  # Push the image the agent fleet actually deploys (NOL-404). Provisioned
  # agents pull the same-project Artifact Registry gnosis:latest (infra
  # envs/*/agents.tf gnosis_image_repository; gnosis_image_tag defaults to
  # "latest"), NOT ghcr.io — the ghcr job above only feeds the chart's
  # non-GCP default. Before this job, AR was refreshed by a manually
  # dispatched mirror in nolgia-agent images.yml, and prod silently ran a
  # month-stale build. Mirrors hermes-agent nolgia-images.yml: keyless WIF
  # auth as gha-agent-images (infra envs/*/wif.tf binds this repo's main).
  # Rollout is NOT done here: the agent-provisioner reconciler installs
  # :latest with pullPolicy Always; running pods pick it up on their next
  # roll.
  artifact-registry:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    # stays hosted: needs docker daemon
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    strategy:
      # Envs are independent: prod auth failing must not cancel stg.
      fail-fast: false
      matrix:
        include:
          - env: stg
            project: nolgia-web-stg
          - env: prod
            project: nolgia-web-prd
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ matrix.env == 'stg' && 'projects/198519101960/locations/global/workloadIdentityPools/github-actions/providers/github' || 'projects/725349205404/locations/global/workloadIdentityPools/github-actions/providers/github' }}
          service_account: gha-agent-images@${{ matrix.project }}.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Runs are no longer serialized, so an older commit's build can finish
      # after a newer one. Always publish the immutable sha- tag; only move
      # :latest when this commit is still main's tip, so a slow run cannot roll
      # the fleet back to an earlier build.
      - name: Resolve image tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: us-west1-docker.pkg.dev/${{ matrix.project }}/nolgia/gnosis
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)"
          {
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:sha-${SHA}"
            if [ "$tip" = "$SHA" ]; then
              echo "${IMAGE}:latest"
            else
              echo "::notice::main moved to ${tip}; publishing sha-${SHA} only, leaving :latest alone" >&2
            fi
            echo TAGS_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Per-env scopes so the two matrix legs keep independent warm
          # caches instead of racing one scope.
          cache-from: type=gha,scope=gnosis-ar-${{ matrix.env }}
          cache-to: type=gha,mode=max,scope=gnosis-ar-${{ matrix.env }}
